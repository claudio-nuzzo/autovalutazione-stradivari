name: Verifiche

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check autovalutazione-app/digcomp-course.js
      - run: node --check autovalutazione-app/teaching-method.js
      - run: node --check autovalutazione-app/results-pdf.js
      - run: node --check autovalutazione-app/progress-drive.js
      - run: node --check autovalutazione-app/progress-storage.js
      - run: node --check autovalutazione-app/tab-lock.js
      - run: npm run test:archive
      - run: npm run test:workerd
      - run: npm run test:progress
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:progress-browser
      - run: npm run test:browser
      - run: node --test tests/grammar-content.test.cjs
      - run: npm run test:grammar-browser
      - run: npm run test:grammar-adapter
      - run: npm run test:grammar-migration
      - run: npm run test:grammar-assessments
      - run: npm run test:grammar-game
      - run: npm run test:grammar-races
